<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="MyCommander">
  <!-- 바깥 둥근 사각형: 824px, 사방 100px 여백 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1a1b1e"/>
  <!-- 좌측 패널(활성): 청록 테두리 -->
  <rect x="148" y="200" width="340" height="624" rx="44" fill="#26282d" stroke="#3bc9db" stroke-width="10"/>
  <!-- 우측 패널(비활성) -->
  <rect x="536" y="200" width="340" height="624" rx="44" fill="#26282d"/>
  <!-- 좌측 행: 두 번째 행이 커서 -->
  <rect x="176" y="272" width="284" height="64" rx="16" fill="#4a4d55"/>
  <rect x="176" y="376" width="284" height="64" rx="16" fill="#3bc9db"/>
  <rect x="176" y="480" width="220" height="64" rx="16" fill="#4a4d55"/>
  <rect x="176" y="584" width="260" height="64" rx="16" fill="#4a4d55"/>
  <rect x="176" y="688" width="190" height="64" rx="16" fill="#4a4d55"/>
  <!-- 우측 행: 네 번째 행이 선택(노랑) -->
  <rect x="564" y="272" width="240" height="64" rx="16" fill="#4a4d55"/>
  <rect x="564" y="376" width="284" height="64" rx="16" fill="#4a4d55"/>
  <rect x="564" y="480" width="200" height="64" rx="16" fill="#4a4d55"/>
  <rect x="564" y="584" width="284" height="64" rx="16" fill="#e3b341"/>
  <rect x="564" y="688" width="230" height="64" rx="16" fill="#4a4d55"/>
</svg>
