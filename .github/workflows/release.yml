name: "Release Tauri App"

on:
  push:
    tags:
      - "v*" # GitHub에 v1.0.0 같은 형태의 태그를 푸시할 때만 실행됩니다.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/ci.yml

  create-draft-release:
    name: 릴리즈 draft 생성
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' && secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 공통 JS 환경 준비
        uses: ./.github/actions/setup-js

      - name: 릴리즈 draft 생성
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          npm run verify:release-version -- --tag "$tag"

          mapfile -t matching_releases < <(
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv"
          )

          if [ "${#matching_releases[@]}" -gt 1 ]; then
            echo "Multiple releases already exist for $tag. Clean up duplicate draft releases before rerunning." >&2
            exit 1
          fi

          if [ "${#matching_releases[@]}" -eq 1 ]; then
            IFS=$'\t' read -r release_id is_draft <<< "${matching_releases[0]}"
            if [ "$is_draft" != "true" ]; then
              echo "Release $tag already exists and is not a draft." >&2
              exit 1
            fi
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MyCommander v$version" \
              --notes "자동으로 빌드된 MyCommander 설치 파일(윈도우, 맥, 리눅스)입니다." \
              --draft \
              --prerelease=false
            release_id="$(
              gh release view "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --json databaseId \
                --jq ".databaseId"
            )"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS는 universal로 빌드 (Apple Silicon / Intel 모두 지원)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      # Fine-grained PAT is more reliable for release creation when GitHub blocks
      # the default workflow token on specific release/tag edge cases.
      RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' && secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 공통 JS 환경 준비
        uses: ./.github/actions/setup-js

      - name: 릴리즈 버전/태그 검증
        run: npm run verify:release-version

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.args, '--target') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 캐시 설정 (빌드 속도 향상)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 리눅스 필수 의존성 패키지 설치 (우분투)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: macOS 배포 서명 설정 확인
        if: matrix.platform == 'macos-latest'
        run: |
          missing=0
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "macOS release builds require Apple signing and notarization secrets."
            exit 1
          fi

      - name: Apple Developer 인증서 가져오기 (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 || true)
          if [ -z "$CERT_INFO" ]; then
            echo "Developer ID Application certificate not found in keychain."
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Tauri 앱 빌드 및 GitHub Release draft 업로드
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
          APPLE_ID: ${{ env.APPLE_ID }}
          APPLE_PASSWORD: ${{ env.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          # All matrix jobs upload to the same pre-created draft release. Letting
          # each job create/find drafts concurrently can split assets across
          # duplicate untagged draft releases for the same tag.
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          # package.json version과 동일한 v* 태그 규칙을 유지합니다.
          tagName: v__VERSION__
          releaseName: "MyCommander v__VERSION__"
          releaseBody: "자동으로 빌드된 MyCommander 설치 파일(윈도우, 맥, 리눅스)입니다."
          # Publish only after the uploaded release assets pass smoke tests.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  verify-release-assets:
    name: 릴리즈 산출물 스모크 테스트
    needs: publish-tauri
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' && secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 공통 JS 환경 준비
        uses: ./.github/actions/setup-js

      - name: 릴리즈 태그 계산
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: 릴리즈 버전/태그 검증
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run verify:release-version -- --tag "$RELEASE_TAG"

      - name: 릴리즈 산출물 검증
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REQUIRE_DRAFT_RELEASE: "1"
        run: bash scripts/verify-release-assets.sh

  publish-release:
    name: 검증된 릴리즈 공개
    needs: verify-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' && secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 공통 JS 환경 준비
        uses: ./.github/actions/setup-js

      - name: 릴리즈 태그 계산
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: GitHub Release 공개
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GITHUB_RELEASE_RETRY_ATTEMPTS: 6
          GITHUB_RELEASE_RETRY_DELAY_SECONDS: 10
        run: |
          set -euo pipefail

          attempts="$GITHUB_RELEASE_RETRY_ATTEMPTS"
          delay="$GITHUB_RELEASE_RETRY_DELAY_SECONDS"

          release_is_public() {
            [[ "$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq ".isDraft"
            )" == "false" ]]
          }

          publish_release_once() {
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false

            release_is_public
          }

          for ((attempt = 1; attempt <= attempts; attempt++)); do
            if release_is_public; then
              echo "Release $RELEASE_TAG is already public."
              exit 0
            fi

            if publish_release_once; then
              echo "Release $RELEASE_TAG is public."
              exit 0
            fi

            if (( attempt >= attempts )); then
              echo "Failed to publish $RELEASE_TAG after $attempt attempts." >&2
              exit 1
            fi

            echo "Publishing $RELEASE_TAG failed on attempt $attempt/$attempts; retrying in ${delay}s." >&2
            sleep "$delay"

            if (( delay < 60 )); then
              delay=$((delay * 2))
              if (( delay > 60 )); then
                delay=60
              fi
            fi
          done
