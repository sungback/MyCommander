name: Setup Rust CI Environment
description: Prepare Rust and its dependency cache for the Rust CI job.

runs:
  using: composite
  steps:
    - name: Rust 설치
      uses: dtolnay/rust-toolchain@stable

    - name: Rust 캐시 설정
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "./src-tauri -> target"
